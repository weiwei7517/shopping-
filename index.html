<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韓國代購管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f6f6f4;
    color:#333;
    font-family:-apple-system,BlinkMacSystemFont,
    "Helvetica Neue","PingFang TC","Noto Sans TC",
    "Microsoft JhengHei",sans-serif;
}

button,input{
    font-family:inherit;
}

.container{
    max-width:760px;
    margin:auto;
    padding:18px 14px 50px;
}

/* ===== 標題 ===== */

.header{
    text-align:center;
    padding:10px 0 20px;
}

.header h1{
    margin:0;
    font-size:26px;
    letter-spacing:1px;
}

.header p{
    margin:7px 0 0;
    color:#999;
    font-size:13px;
}

/* ===== 匯率 ===== */

.rate-box{
    background:#fff;
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.rate-title{
    font-size:13px;
    color:#888;
    margin-bottom:8px;
}

.rate-row{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
}

.rate-row input{
    width:90px;
    padding:8px 10px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
}

/* ===== 統計 ===== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:14px;
}

.stat{
    background:#fff;
    border-radius:13px;
    padding:11px 4px;
    text-align:center;
}

.stat-number{
    font-size:19px;
    font-weight:700;
}

.stat-label{
    font-size:11px;
    color:#999;
    margin-top:3px;
}

/* ===== 篩選 ===== */

.filter-box{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:3px;
    margin-bottom:14px;
}

.filter-btn{
    flex:0 0 auto;
    background:#fff;
    color:#666;
    border:1px solid #e3e3e3;
    border-radius:20px;
    padding:8px 13px;
    font-size:13px;
}

.filter-btn.active{
    background:#333;
    color:#fff;
    border-color:#333;
}

/* ===== 新增訂單 ===== */

.add-box{
    background:#fff;
    border-radius:17px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.add-title{
    font-size:17px;
    font-weight:600;
    margin-bottom:13px;
}

.customer-input{
    width:100%;
    border:1px solid #ddd;
    border-radius:9px;
    padding:11px 12px;
    font-size:14px;
    outline:none;
    margin-bottom:12px;
}

.items-title{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

/* ===== 新增品項 ===== */

.new-item{
    background:#f7f7f5;
    border-radius:12px;
    padding:11px;
    margin-bottom:8px;
}

.new-item-row{
    display:grid;
    grid-template-columns:1fr 110px 30px;
    gap:7px;
    align-items:center;
}

.new-item input{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:9px;
    font-size:13px;
}

.remove-item{
    width:30px;
    height:30px;
    border-radius:8px;
    border:0;
    background:#e9e9e7;
    color:#777;
    font-size:16px;
}

.new-item-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
}

.new-checks{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.check{
    position:relative;
}

.check input{
    position:absolute;
    opacity:0;
}

.check label{
    display:flex;
    align-items:center;
    gap:5px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:6px 8px;
    font-size:11px;
    color:#777;
    background:#fff;
    cursor:pointer;
    user-select:none;
}

.check-box{
    width:15px;
    height:15px;
    border:1px solid #bbb;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.check input:checked + label{
    background:#333;
    color:#fff;
    border-color:#333;
}

.check input:checked + label .check-box{
    background:#fff;
    color:#333;
    border-color:#fff;
}

.item-preview{
    font-size:11px;
    color:#999;
    white-space:nowrap;
}

.add-item-btn{
    width:100%;
    background:#f0f0ee;
    border:1px dashed #ccc;
    color:#666;
    padding:9px;
    border-radius:9px;
    font-size:13px;
    margin-top:3px;
}

.order-total{
    background:#f2f2f0;
    border-radius:11px;
    padding:12px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.total-label{
    font-size:13px;
    color:#777;
}

.total-krw{
    font-size:17px;
    font-weight:700;
}

.total-twd{
    font-size:12px;
    color:#888;
    margin-top:2px;
    text-align:right;
}

.save-btn{
    width:100%;
    background:#333;
    color:#fff;
    padding:12px;
    border-radius:10px;
    border:0;
    font-size:14px;
    margin-top:10px;
}

/* ===== 訂單 ===== */

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 2px 10px;
}

.list-header h2{
    margin:0;
    font-size:17px;
}

.list-header span{
    color:#999;
    font-size:12px;
}

.customer-card{
    background:#fff;
    border-radius:17px;
    margin-bottom:13px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.customer-head{
    padding:14px 15px;
    border-bottom:1px solid #eee;
}

.customer-name{
    font-size:17px;
    font-weight:600;
}

.customer-summary{
    margin-top:9px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

.summary-box{
    background:#f6f6f4;
    border-radius:8px;
    padding:7px 8px;
}

.summary-label{
    font-size:10px;
    color:#999;
}

.summary-value{
    font-size:12px;
    font-weight:600;
    margin-top:2px;
}

/* ===== 品項 ===== */

.item{
    padding:13px 15px;
    border-bottom:1px solid #f0f0f0;
}

.item:last-child{
    border-bottom:none;
}

.item-main{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.item-name{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
}

.item-price{
    text-align:right;
    flex-shrink:0;
}

.krw{
    font-size:14px;
    font-weight:600;
}

.twd{
    font-size:11px;
    color:#999;
    margin-top:2px;
}

.item-status{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.badges{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.badge{
    border-radius:20px;
    padding:5px 8px;
    font-size:10px;
    background:#f0f0ee;
    color:#777;
}

.badge.active{
    background:#333;
    color:#fff;
}

.badge.out{
    background:#ddd;
    color:#666;
}

.actions{
    display:flex;
    gap:4px;
}

.small-btn{
    border:1px solid #ddd;
    background:#fff;
    color:#777;
    border-radius:7px;
    padding:5px 7px;
    font-size:10px;
}

.empty{
    text-align:center;
    padding:45px 10px;
    color:#aaa;
    font-size:13px;
    background:#fff;
    border-radius:15px;
}

/* ===== 手機 ===== */

@media(max-width:520px){

    .new-item-row{
        grid-template-columns:1fr 95px 30px;
    }

    .stats{
        gap:5px;
    }

    .stat-number{
        font-size:17px;
    }

    .stat-label{
        font-size:10px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🇰🇷 韓國代購</h1>
        <p>代購訂單管理</p>
    </div>

    <!-- 匯率 -->
    <div class="rate-box">

        <div class="rate-title">
            韓元 → 台幣匯率
        </div>

        <div class="rate-row">
            <span>₩1,000 ≈</span>

            <input
                id="rate"
                type="number"
                value="23"
                step="0.1"
                onchange="saveRate()"
            >

            <span>NT$</span>
        </div>

    </div>

    <!-- 統計 -->
    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="allCount">0</div>
            <div class="stat-label">全部品項</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="boughtCount">0</div>
            <div class="stat-label">已購買</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="outCount">0</div>
            <div class="stat-label">沒貨</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="unpaidCount">0</div>
            <div class="stat-label">未付</div>
        </div>

    </div>

    <!-- 篩選 -->
    <div class="filter-box">

        <button class="filter-btn active"
                onclick="setFilter('all',this)">
            全部訂單
        </button>

        <button class="filter-btn"
                onclick="setFilter('waiting',this)">
            ⏳ 未購買
        </button>

        <button class="filter-btn"
                onclick="setFilter('bought',this)">
            ✓ 已購買
        </button>

        <button class="filter-btn"
                onclick="setFilter('out',this)">
            × 沒貨
        </button>

        <button class="filter-btn"
                onclick="setFilter('paid',this)">
            ✓ 已付
        </button>

        <button class="filter-btn"
                onclick="setFilter('unpaid',this)">
            ○ 未付
        </button>

    </div>

    <!-- 新增一個客人的完整訂單 -->
    <div class="add-box">

        <div class="add-title">
            ＋ 新增客人訂單
        </div>

        <input
            id="newCustomer"
            class="customer-input"
            type="text"
            placeholder="客人名字"
        >

        <div class="items-title">
            代購品項
        </div>

        <div id="newItems"></div>

        <button
            class="add-item-btn"
            onclick="addNewItemRow()"
        >
            ＋ 新增品項
        </button>

        <div class="order-total">

            <div>
                <div class="total-label">
                    訂單總計
                </div>

                <div class="total-krw"
                     id="newTotalKRW">
                    ₩0
                </div>
            </div>

            <div>
                <div class="total-twd"
                     id="newTotalTWD">
                    約 NT$0
                </div>
            </div>

        </div>

        <button
            class="save-btn"
            onclick="saveOrder()"
        >
            儲存整張訂單
        </button>

    </div>

    <!-- 訂單清單 -->
    <div class="list-header">

        <h2>訂單清單</h2>

        <span id="totalText">
            0 筆
        </span>

    </div>

    <div id="list"></div>

</div>


<script>

/* =========================
   資料
========================= */

let orders =
    JSON.parse(
        localStorage.getItem("koreaOrders")
    ) || [];

let rate =
    Number(
        localStorage.getItem("koreaRate")
    ) || 23;

let currentFilter = "all";

document.getElementById("rate").value = rate;


/* =========================
   初始新增一個品項
========================= */

addNewItemRow();


/* =========================
   儲存
========================= */

function saveData(){

    localStorage.setItem(
        "koreaOrders",
        JSON.stringify(orders)
    );

}


/* =========================
   匯率
========================= */

function saveRate(){

    rate =
        Number(
            document.getElementById("rate").value
        ) || 23;

    localStorage.setItem(
        "koreaRate",
        rate
    );

    updateNewOrderTotal();

    render();

}


/* =========================
   韓元轉台幣
========================= */

function toTWD(price){

    return Math.round(
        Number(price || 0) / 1000 * rate
    );

}


/* =========================
   新增品項輸入框
========================= */

function addNewItemRow(){

    const container =
        document.getElementById("newItems");

    const id =
        "new_" + Date.now() + "_" +
        Math.random().toString(36).substr(2,5);

    const div =
        document.createElement("div");

    div.className = "new-item";

    div.dataset.id = id;

    div.innerHTML = `

        <div class="new-item-row">

            <input
                class="new-product"
                type="text"
                placeholder="品項名稱"
                oninput="updateNewOrderTotal()"
            >

            <input
                class="new-price"
                type="number"
                placeholder="韓元"
                oninput="updateNewOrderTotal()"
            >

            <button
                class="remove-item"
                onclick="removeNewItem(this)"
            >
                ×
            </button>

        </div>

        <div class="new-item-bottom">

            <div class="new-checks">

                <div class="check">

                    <input
                        class="new-bought"
                        id="${id}_b"
                        type="checkbox"
                    >

                    <label for="${id}_b">
                        <span class="check-box">✓</span>
                        已購買
                    </label>

                </div>

                <div class="check">

                    <input
                        class="new-out"
                        id="${id}_o"
                        type="checkbox"
                    >

                    <label for="${id}_o">
                        <span class="check-box">✓</span>
                        沒貨
                    </label>

                </div>

                <div class="check">

                    <input
                        class="new-paid"
                        id="${id}_p"
                        type="checkbox"
                    >

                    <label for="${id}_p">
                        <span class="check-box">✓</span>
                        已付
                    </label>

                </div>

            </div>

            <div class="item-preview">
                約 NT$0
            </div>

        </div>
    `;

    container.appendChild(div);

}


/* =========================
   刪除尚未儲存的品項
========================= */

function removeNewItem(button){

    const rows =
        document.querySelectorAll(".new-item");

    if(rows.length <= 1){

        return;

    }

    button
        .closest(".new-item")
        .remove();

    updateNewOrderTotal();

}


/* =========================
   計算正在新增的訂單
========================= */

function updateNewOrderTotal(){

    const rows =
        document.querySelectorAll(".new-item");

    let total = 0;

    rows.forEach(row => {

        const price =
            Number(
                row.querySelector(".new-price").value
            ) || 0;

        total += price;

        row.querySelector(".item-preview").innerText =
            "約 NT$" +
            toTWD(price).toLocaleString();

    });


    document.getElementById("newTotalKRW").innerText =
        "₩" + total.toLocaleString();

    document.getElementById("newTotalTWD").innerText =
        "約 NT$" +
        toTWD(total).toLocaleString();

}


/* =========================
   儲存整張訂單
========================= */

function saveOrder(){

    const customer =
        document.getElementById("newCustomer").value;

    const rows =
        document.querySelectorAll(".new-item");

    const items = [];


    rows.forEach(row => {

        const product =
            row.querySelector(".new-product").value;

        const price =
            Number(
                row.querySelector(".new-price").value
            ) || 0;

        const bought =
            row.querySelector(".new-bought").checked;

        const out =
            row.querySelector(".new-out").checked;

        const paid =
            row.querySelector(".new-paid").checked;


        /*
           空白也允許儲存
        */

        items.push({

            id:
                Date.now() +
                Math.random(),

            product:product,

            price:price,

            bought:bought,

            out:out,

            paid:paid

        });

    });


    orders.push({

        id:Date.now(),

        customer:customer,

        items:items

    });


    saveData();


    /* 清空 */

    document.getElementById("newCustomer").value = "";

    document.getElementById("newItems").innerHTML = "";

    addNewItemRow();

    updateNewOrderTotal();

    render();

}


/* =========================
   篩選
========================= */

function setFilter(filter,button){

    currentFilter = filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    button.classList.add("active");

    render();

}


/* =========================
   訂單是否符合篩選
========================= */

function orderMatches(order){

    if(currentFilter === "all"){
        return true;
    }

    return order.items.some(item => {

        if(currentFilter === "waiting"){
            return !item.bought && !item.out;
        }

        if(currentFilter === "bought"){
            return item.bought;
        }

        if(currentFilter === "out"){
            return item.out;
        }

        if(currentFilter === "paid"){
            return item.paid;
        }

        if(currentFilter === "unpaid"){
            return !item.paid;
        }

        return true;

    });

}


/* =========================
   切換品項狀態
========================= */

function toggleItem(orderId,itemId,type){

    const order =
        orders.find(o => o.id === orderId);

    if(!order){
        return;
    }

    const item =
        order.items.find(i => i.id === itemId);

    if(!item){
        return;
    }


    if(type === "bought"){
        item.bought = !item.bought;
    }

    if(type === "out"){
        item.out = !item.out;
    }

    if(type === "paid"){
        item.paid = !item.paid;
    }


    saveData();

    render();

}


/* =========================
   刪除整張訂單
========================= */

function deleteOrder(orderId){

    if(
        !confirm("確定要刪除整張訂單嗎？")
    ){
        return;
    }

    orders =
        orders.filter(
            order => order.id !== orderId
        );

    saveData();

    render();

}


/* =========================
   刪除品項
========================= */

function deleteItem(orderId,itemId){

    const order =
        orders.find(o => o.id === orderId);

    if(!order){
        return;
    }

    if(
        !confirm("確定要刪除這個品項嗎？")
    ){
        return;
    }

    order.items =
        order.items.filter(
            item => item.id !== itemId
        );

    saveData();

    render();

}


/* =========================
   訂單統計
========================= */

function getOrderStats(order){

    let total = 0;

    let bought = 0;

    let out = 0;

    let unpaid = 0;

    order.items.forEach(item => {

        const price =
            Number(item.price || 0);

        total += price;

        if(item.bought){
            bought += price;
        }

        if(item.out){
            out += price;
        }

        if(!item.paid){
            unpaid += price;
        }

    });


    return {
        total,
        bought,
        out,
        unpaid
    };

}


/* =========================
   顯示
========================= */

function render(){

    const list =
        document.getElementById("list");

    list.innerHTML = "";


    /* 全部統計 */

    let all = 0;

    let bought = 0;

    let out = 0;

    let unpaid = 0;


    orders.forEach(order => {

        order.items.forEach(item => {

            all++;

            if(item.bought){
                bought++;
            }

            if(item.out){
                out++;
            }

            if(!item.paid){
                unpaid++;
            }

        });

    });


    document.getElementById("allCount").innerText =
        all;

    document.getElementById("boughtCount").innerText =
        bought;

    document.getElementById("outCount").innerText =
        out;

    document.getElementById("unpaidCount").innerText =
        unpaid;


    /* 篩選訂單 */

    const filtered =
        orders.filter(orderMatches);


    document.getElementById("totalText").innerText =
        filtered.length + " 位客人";


    if(filtered.length === 0){

        list.innerHTML = `
            <div class="empty">
                目前沒有符合條件的訂單 ♡
            </div>
        `;

        return;

    }


    filtered.forEach(order => {

        const stats =
            getOrderStats(order);

        const card =
            document.createElement("div");

        card.className =
            "customer-card";


        /* 客人標題 */

        card.innerHTML = `

            <div class="customer-head">

                <div class="customer-name">
                    👤 ${
                        escapeHTML(
                            order.customer ||
                            "未填寫姓名"
                        )
                    }
                </div>

                <div class="customer-summary">

                    <div class="summary-box">

                        <div class="summary-label">
                            訂單總額
                        </div>

                        <div class="summary-value">
                            ₩${stats.total.toLocaleString()}
                        </div>

                    </div>

                    <div class="summary-box">

                        <div class="summary-label">
                            台幣約
                        </div>

                        <div class="summary-value">
                            NT$${toTWD(stats.total).toLocaleString()}
                        </div>

                    </div>

                    <div class="summary-box">

                        <div class="summary-label">
                            已購買
                        </div>

                        <div class="summary-value">
                            ₩${stats.bought.toLocaleString()}
                        </div>

                    </div>

                    <div class="summary-box">

                        <div class="summary-label">
                            未付
                        </div>

                        <div class="summary-value">
                            ₩${stats.unpaid.toLocaleString()}
                        </div>

                    </div>

                </div>

                <div style="margin-top:9px;text-align:right;">

                    <button
                        class="small-btn"
                        onclick="deleteOrder(${order.id})"
                    >
                        刪除整張訂單
                    </button>

                </div>

            </div>

        `;


        /* 品項 */

        order.items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "item";


            let badges = "";


            if(item.bought){

                badges += `
                    <span class="badge active">
                        ✓ 已購買
                    </span>
                `;

            }else{

                badges += `
                    <span class="badge">
                        ⏳ 未購買
                    </span>
                `;

            }


            if(item.out){

                badges += `
                    <span class="badge out">
                        × 沒貨
                    </span>
                `;

            }


            if(item.paid){

                badges += `
                    <span class="badge active">
                        ✓ 已付
                    </span>
                `;

            }else{

                badges += `
                    <span class="badge">
                        ○ 未付
                    </span>
                `;

            }


            div.innerHTML = `

                <div class="item-main">

                    <div class="item-name">

                        ${
                            escapeHTML(
                                item.product ||
                                "未填寫品項"
                            )
                        }

                    </div>

                    <div class="item-price">

                        <div class="krw">
                            ₩${Number(
                                item.price || 0
                            ).toLocaleString()}
                        </div>

                        <div class="twd">
                            約 NT$${toTWD(
                                item.price
                            ).toLocaleString()}
                        </div>

                    </div>

                </div>


                <div class="item-status">

                    <div class="badges">
                        ${badges}
                    </div>

                    <div class="actions">

                        <button
                            class="small-btn"
                            onclick="toggleItem(
                                ${order.id},
                                ${item.id},
                                'bought'
                            )"
                        >
                            ✓
                        </button>

                        <button
                            class="small-btn"
                            onclick="toggleItem(
                                ${order.id},
                                ${item.id},
                                'out'
                            )"
                        >
                            ×
                        </button>

                        <button
                            class="small-btn"
                            onclick="toggleItem(
                                ${order.id},
                                ${item.id},
                                'paid'
                            )"
                        >
                            $
                        </button>

                        <button
                            class="small-btn"
                            onclick="deleteItem(
                                ${order.id},
                                ${item.id}
                            )"
                        >
                            刪除
                        </button>

                    </div>

                </div>

            `;


            card.appendChild(div);

        });


        list.appendChild(card);

    });

}


/* =========================
   防止特殊字元
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   初始顯示
========================= */

render();

</script>

</body>
</html>
