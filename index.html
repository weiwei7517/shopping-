<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>韓國代購管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f6f6f4;
    color:#333;
    font-family:-apple-system,BlinkMacSystemFont,
    "Helvetica Neue","PingFang TC","Noto Sans TC",
    "Microsoft JhengHei",sans-serif;
}

button,
input{
    font-family:inherit;
}

.container{
    max-width:760px;
    margin:auto;
    padding:18px 14px 50px;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:8px 0 20px;
}

.header h1{
    margin:0;
    font-size:26px;
    letter-spacing:1px;
}

.header p{
    margin:7px 0 0;
    color:#999;
    font-size:13px;
}

/* =========================
   匯率
========================= */

.rate-box{
    background:#fff;
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.rate-title{
    font-size:13px;
    color:#888;
    margin-bottom:8px;
}

.rate-row{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
}

.rate-row input{
    width:90px;
    padding:8px 10px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
}

/* =========================
   統計
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:14px;
}

.stat{
    background:#fff;
    border-radius:13px;
    padding:11px 4px;
    text-align:center;
}

.stat-number{
    font-size:18px;
    font-weight:700;
}

.stat-label{
    font-size:10px;
    color:#999;
    margin-top:3px;
}

/* =========================
   篩選
========================= */

.filter-box{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:3px;
    margin-bottom:14px;
}

.filter-btn{
    flex:0 0 auto;
    background:#fff;
    color:#666;
    border:1px solid #e3e3e3;
    border-radius:20px;
    padding:8px 13px;
    font-size:13px;
}

.filter-btn.active{
    background:#333;
    color:#fff;
    border-color:#333;
}

/* =========================
   新增訂單
========================= */

.add-box{
    background:#fff;
    border-radius:17px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.add-title{
    font-size:17px;
    font-weight:600;
    margin-bottom:13px;
}

.customer-input{
    width:100%;
    border:1px solid #ddd;
    border-radius:9px;
    padding:11px 12px;
    font-size:14px;
    outline:none;
    margin-bottom:12px;
}

.items-title{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

/* =========================
   新增品項
========================= */

.new-item{
    background:#f7f7f5;
    border-radius:12px;
    padding:11px;
    margin-bottom:8px;
}

.new-item-row{
    display:grid;
    grid-template-columns:1fr 110px 30px;
    gap:7px;
    align-items:center;
}

.new-item input{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:9px;
    font-size:13px;
}

.remove-item{
    width:30px;
    height:30px;
    border-radius:8px;
    border:0;
    background:#e9e9e7;
    color:#777;
    font-size:16px;
}

.new-item-bottom{
    margin-top:8px;
}

.status-checks{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* =========================
   CHECKBOX
========================= */

.check{
    position:relative;
}

.check input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.check label{
    display:flex;
    align-items:center;
    gap:5px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:7px 9px;
    font-size:11px;
    color:#777;
    background:#fff;
    cursor:pointer;
    user-select:none;
}

.check-box{
    width:15px;
    height:15px;
    border:1px solid #bbb;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.check input:checked + label{
    background:#333;
    color:#fff;
    border-color:#333;
}

.check input:checked + label .check-box{
    background:#fff;
    color:#333;
    border-color:#fff;
}

/* =========================
   新增品項按鈕
========================= */

.add-item-btn{
    width:100%;
    background:#f0f0ee;
    border:1px dashed #ccc;
    color:#666;
    padding:9px;
    border-radius:9px;
    font-size:13px;
    margin-top:3px;
}

/* =========================
   總計
========================= */

.order-total{
    background:#f2f2f0;
    border-radius:11px;
    padding:12px;
    margin-top:10px;
}

.total-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:5px;
}

.total-line:last-child{
    margin-bottom:0;
}

.total-label{
    font-size:12px;
    color:#888;
}

.total-value{
    font-size:16px;
    font-weight:700;
}

.total-twd{
    font-size:12px;
    color:#888;
}

.save-btn{
    width:100%;
    background:#333;
    color:#fff;
    padding:12px;
    border-radius:10px;
    border:0;
    font-size:14px;
    margin-top:10px;
}

/* =========================
   訂單清單
========================= */

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 2px 10px;
}

.list-header h2{
    margin:0;
    font-size:17px;
}

.list-header span{
    color:#999;
    font-size:12px;
}

/* =========================
   客人訂單
========================= */

.customer-card{
    background:#fff;
    border-radius:17px;
    margin-bottom:13px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.customer-head{
    padding:15px;
    border-bottom:1px solid #eee;
}

.customer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.customer-name{
    font-size:18px;
    font-weight:600;
}

.edit-order-btn{
    border:1px solid #ddd;
    background:#fff;
    color:#666;
    border-radius:8px;
    padding:7px 10px;
    font-size:11px;
}

/* =========================
   訂單總覽
========================= */

.order-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:11px;
}

.summary-box{
    background:#f6f6f4;
    border-radius:9px;
    padding:8px;
}

.summary-label{
    font-size:10px;
    color:#999;
}

.summary-value{
    font-size:13px;
    font-weight:600;
    margin-top:3px;
}

.summary-twd{
    font-size:10px;
    color:#999;
    margin-top:2px;
}

/* =========================
   已付 / 尚欠
========================= */

.payment-box{
    margin-top:8px;
    padding:10px;
    border-radius:10px;
    background:#f2f2f0;
}

.payment-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    margin-bottom:5px;
}

.payment-row:last-child{
    margin-bottom:0;
}

.payment-value{
    font-weight:600;
}

.debt{
    font-size:14px;
}

/* =========================
   品項
========================= */

.item{
    padding:13px 15px;
    border-bottom:1px solid #f0f0f0;
}

.item:last-child{
    border-bottom:none;
}

.item-main{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.item-name{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
}

.item-price{
    text-align:right;
    flex-shrink:0;
}

.krw{
    font-size:14px;
    font-weight:600;
}

.twd{
    font-size:11px;
    color:#999;
    margin-top:2px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:9px;
}

.badge{
    border-radius:20px;
    padding:5px 8px;
    font-size:10px;
    background:#f0f0ee;
    color:#777;
}

.badge.active{
    background:#333;
    color:#fff;
}

.badge.out{
    background:#ddd;
    color:#666;
}

/* =========================
   訂單底部
========================= */

.order-footer{
    padding:12px 15px;
    background:#fafaf9;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.delete-order{
    border:1px solid #ddd;
    background:#fff;
    color:#999;
    border-radius:8px;
    padding:7px 10px;
    font-size:11px;
}

.item-count{
    font-size:11px;
    color:#999;
}

/* =========================
   編輯視窗
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.38);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:760px;
    background:#fff;
    border-radius:20px 20px 0 0;
    padding:20px 15px 25px;
    max-height:92vh;
    overflow-y:auto;
}

.modal-title{
    font-size:18px;
    font-weight:600;
    margin-bottom:14px;
}

.modal-customer{
    width:100%;
    border:1px solid #ddd;
    border-radius:9px;
    padding:11px;
    font-size:14px;
    margin-bottom:12px;
}

.edit-item{
    background:#f7f7f5;
    border-radius:12px;
    padding:11px;
    margin-bottom:8px;
}

.edit-item-row{
    display:grid;
    grid-template-columns:1fr 110px 30px;
    gap:7px;
}

.edit-item input{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:9px;
    font-size:13px;
}

.edit-item-bottom{
    margin-top:8px;
}

.paid-section{
    margin-top:14px;
    background:#f5f5f3;
    border-radius:12px;
    padding:12px;
}

.paid-title{
    font-size:12px;
    color:#777;
    margin-bottom:7px;
}

.paid-input{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    padding:11px;
    font-size:14px;
}

.paid-preview{
    margin-top:6px;
    color:#999;
    font-size:11px;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.cancel-btn{
    background:#eee;
    color:#555;
    border:0;
    border-radius:10px;
    padding:12px;
}

.update-btn{
    background:#333;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:12px;
}

/* =========================
   空白
========================= */

.empty{
    text-align:center;
    padding:45px 10px;
    color:#aaa;
    font-size:13px;
    background:#fff;
    border-radius:15px;
}

/* =========================
   手機
========================= */

@media(max-width:520px){

    .stats{
        gap:5px;
    }

    .stat-number{
        font-size:16px;
    }

    .stat-label{
        font-size:9px;
    }

    .new-item-row,
    .edit-item-row{
        grid-template-columns:1fr 90px 30px;
    }

    .customer-top{
        align-items:flex-start;
    }

}
</style>
</head>


<body>

<div class="container">

    <!-- 標題 -->

    <div class="header">

        <h1>🇰🇷 韓國代購</h1>

        <p>
            代購訂單管理
        </p>

    </div>


    <!-- 匯率 -->

    <div class="rate-box">

        <div class="rate-title">
            韓元 → 台幣匯率
        </div>

        <div class="rate-row">

            <span>₩1,000 ≈</span>

            <input
                id="rate"
                type="number"
                value="23"
                step="0.1"
                onchange="saveRate()"
            >

            <span>NT$</span>

        </div>

    </div>


    <!-- 統計 -->

    <div class="stats">

        <div class="stat">
            <div
                class="stat-number"
                id="allCount"
            >
                0
            </div>

            <div class="stat-label">
                全部品項
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="boughtCount"
            >
                0
            </div>

            <div class="stat-label">
                已購買
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="outCount"
            >
                0
            </div>

            <div class="stat-label">
                沒貨
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="unpaidTotal"
            >
                ₩0
            </div>

            <div class="stat-label">
                尚欠
            </div>
        </div>

    </div>


    <!-- 篩選 -->

    <div class="filter-box">

        <button
            class="filter-btn active"
            onclick="setFilter('all',this)"
        >
            全部訂單
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('waiting',this)"
        >
            ⏳ 未購買
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('bought',this)"
        >
            ✓ 已購買
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('out',this)"
        >
            × 沒貨
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('unpaid',this)"
        >
            ○ 未付
        </button>

    </div>


    <!-- 新增訂單 -->

    <div class="add-box">

        <div class="add-title">
            ＋ 新增客人訂單
        </div>


        <input
            id="newCustomer"
            class="customer-input"
            type="text"
            placeholder="客人名字"
        >


        <div class="items-title">
            代購品項
        </div>


        <div id="newItems"></div>


        <button
            class="add-item-btn"
            onclick="addNewItemRow()"
        >
            ＋ 新增品項
        </button>


        <!-- 總計 -->

        <div class="order-total">

            <div class="total-line">

                <span class="total-label">
                    韓元總計
                </span>

                <span
                    class="total-value"
                    id="newTotalKRW"
                >
                    ₩0
                </span>

            </div>


            <div class="total-line">

                <span class="total-label">
                    台幣約
                </span>

                <span
                    class="total-twd"
                    id="newTotalTWD"
                >
                    NT$0
                </span>

            </div>

        </div>


        <button
            class="save-btn"
            onclick="saveOrder()"
        >
            儲存整張訂單
        </button>

    </div>


    <!-- 訂單 -->

    <div class="list-header">

        <h2>
            訂單清單
        </h2>

        <span id="totalText">
            0 位客人
        </span>

    </div>


    <div id="list"></div>

</div>


<!-- =========================
     編輯視窗
========================= -->

<div
    class="modal"
    id="editModal"
>

    <div class="modal-box">

        <div class="modal-title">
            編輯訂單
        </div>


        <input
            id="editCustomer"
            class="modal-customer"
            type="text"
            placeholder="客人名字"
        >


        <div class="items-title">
            品項與貨況
        </div>


        <div id="editItems"></div>


        <button
            class="add-item-btn"
            onclick="addEditItemRow()"
        >
            ＋ 新增品項
        </button>


        <!-- 已付多少 -->

        <div class="paid-section">

            <div class="paid-title">
                已付多少韓元？
            </div>

            <input
                id="editPaid"
                class="paid-input"
                type="number"
                placeholder="例如 50000"
                oninput="updateEditPayment()"
            >

            <div
                class="paid-preview"
                id="editPaymentPreview"
            >
                尚欠 ₩0｜約 NT$0
            </div>

        </div>


        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeEdit()"
            >
                取消
            </button>

            <button
                class="update-btn"
                onclick="updateOrder()"
            >
                儲存修改
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================
   資料
===================================== */

let orders =
    JSON.parse(
        localStorage.getItem("koreaOrdersV3")
    ) || [];


let rate =
    Number(
        localStorage.getItem("koreaRateV3")
    ) || 23;


let currentFilter = "all";

let editingOrderId = null;


document.getElementById("rate").value = rate;


/* =====================================
   初始化
===================================== */

addNewItemRow();

render();


/* =====================================
   儲存資料
===================================== */

function saveData(){

    localStorage.setItem(
        "koreaOrdersV3",
        JSON.stringify(orders)
    );

}


/* =====================================
   匯率
===================================== */

function saveRate(){

    rate =
        Number(
            document.getElementById("rate").value
        ) || 23;


    localStorage.setItem(
        "koreaRateV3",
        rate
    );


    updateNewOrderTotal();

    render();

}


/* =====================================
   韓元 → 台幣
===================================== */

function toTWD(price){

    return Math.round(
        Number(price || 0) / 1000 * rate
    );

}


/* =====================================
   新增品項
===================================== */

function addNewItemRow(){

    const container =
        document.getElementById("newItems");


    const id =
        "new_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substr(2,6);


    const div =
        document.createElement("div");


    div.className = "new-item";

    div.dataset.id = id;


    div.innerHTML = `

        <div class="new-item-row">

            <input
                class="new-product"
                type="text"
                placeholder="品項名稱"
                oninput="updateNewOrderTotal()"
            >

            <input
                class="new-price"
                type="number"
                placeholder="韓元"
                oninput="updateNewOrderTotal()"
            >

            <button
                class="remove-item"
                onclick="removeNewItem(this)"
            >
                ×
            </button>

        </div>


        <div class="new-item-bottom">

            <div class="status-checks">

                <div class="check">

                    <input
                        id="${id}_b"
                        class="new-bought"
                        type="checkbox"
                    >

                    <label for="${id}_b">

                        <span class="check-box">
                            ✓
                        </span>

                        已購買

                    </label>

                </div>


                <div class="check">

                    <input
                        id="${id}_o"
                        class="new-out"
                        type="checkbox"
                    >

                    <label for="${id}_o">

                        <span class="check-box">
                            ✓
                        </span>

                        沒貨

                    </label>

                </div>

            </div>

        </div>

    `;


    container.appendChild(div);

}


/* =====================================
   刪除新增中的品項
===================================== */

function removeNewItem(button){

    const rows =
        document.querySelectorAll(
            "#newItems .new-item"
        );


    if(rows.length <= 1){

        return;

    }


    button
        .closest(".new-item")
        .remove();


    updateNewOrderTotal();

}


/* =====================================
   新增訂單總計
===================================== */

function updateNewOrderTotal(){

    const rows =
        document.querySelectorAll(
            "#newItems .new-item"
        );


    let total = 0;


    rows.forEach(row => {

        total +=
            Number(
                row.querySelector(
                    ".new-price"
                ).value
            ) || 0;

    });


    document.getElementById(
        "newTotalKRW"
    ).innerText =
        "₩" +
        total.toLocaleString();


    document.getElementById(
        "newTotalTWD"
    ).innerText =
        "NT$" +
        toTWD(total).toLocaleString();

}


/* =====================================
   儲存訂單
===================================== */

function saveOrder(){

    const customer =
        document.getElementById(
            "newCustomer"
        ).value;


    const rows =
        document.querySelectorAll(
            "#newItems .new-item"
        );


    const items = [];


    rows.forEach(row => {

        items.push({

            id:
                Date.now() +
                Math.random(),

            product:
                row.querySelector(
                    ".new-product"
                ).value,

            price:
                Number(
                    row.querySelector(
                        ".new-price"
                    ).value
                ) || 0,

            bought:
                row.querySelector(
                    ".new-bought"
                ).checked,

            out:
                row.querySelector(
                    ".new-out"
                ).checked

        });

    });


    orders.push({

        id:Date.now(),

        customer:customer,

        paid:0,

        items:items

    });


    saveData();


    document.getElementById(
        "newCustomer"
    ).value = "";


    document.getElementById(
        "newItems"
    ).innerHTML = "";


    addNewItemRow();


    updateNewOrderTotal();

    render();

}


/* =====================================
   篩選
===================================== */

function setFilter(filter,button){

    currentFilter = filter;


    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add("active");


    render();

}


/* =====================================
   篩選判斷
===================================== */

function orderMatches(order){

    if(currentFilter === "all"){
        return true;
    }


    if(currentFilter === "waiting"){

        return order.items.some(
            item =>
                !item.bought &&
                !item.out
        );

    }


    if(currentFilter === "bought"){

        return order.items.some(
            item => item.bought
        );

    }


    if(currentFilter === "out"){

        return order.items.some(
            item => item.out
        );

    }


    if(currentFilter === "unpaid"){

        const stats =
            getStats(order);

        return stats.paid <
               stats.total;

    }


    return true;

}


/* =====================================
   計算訂單
===================================== */

function getStats(order){

    let total = 0;

    let bought = 0;

    let out = 0;


    order.items.forEach(item => {

        const price =
            Number(item.price || 0);


        total += price;


        if(item.bought){

            bought += price;

        }


        if(item.out){

            out += price;

        }

    });


    const paid =
        Math.min(
            Number(order.paid || 0),
            total
        );


    const unpaid =
        Math.max(
            total - paid,
            0
        );


    return {
        total,
        bought,
        out,
        paid,
        unpaid
    };

}


/* =====================================
   編輯訂單
===================================== */

function openEdit(orderId){

    const order =
        orders.find(
            o => o.id === orderId
        );


    if(!order){
        return;
    }


    editingOrderId =
        orderId;


    document.getElementById(
        "editCustomer"
    ).value =
        order.customer || "";


    document.getElementById(
        "editPaid"
    ).value =
        order.paid || 0;


    document.getElementById(
        "editItems"
    ).innerHTML = "";


    order.items.forEach(item => {

        addEditItemRow(item);

    });


    updateEditPayment();


    document.getElementById(
        "editModal"
    ).classList.add("show");

}


/* =====================================
   新增編輯品項
===================================== */

function addEditItemRow(item = null){

    const container =
        document.getElementById(
            "editItems"
        );


    const id =
        "edit_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substr(2,6);


    const div =
        document.createElement("div");


    div.className =
        "edit-item";


    div.dataset.id =
        item && item.id
            ? item.id
            : Date.now() +
              Math.random();


    div.innerHTML = `

        <div class="edit-item-row">

            <input
                class="edit-product"
                type="text"
                placeholder="品項名稱"
                value="${
                    escapeAttr(
                        item
                        ? item.product
                        : ""
                    )
                }"
                oninput="updateEditPayment()"
            >

            <input
                class="edit-price"
                type="number"
                placeholder="韓元"
                value="${
                    item
                    ? item.price || ""
                    : ""
                }"
                oninput="updateEditPayment()"
            >

            <button
                class="remove-item"
                onclick="removeEditItem(this)"
            >
                ×
            </button>

        </div>


        <div class="edit-item-bottom">

            <div class="status-checks">

                <div class="check">

                    <input
                        id="${id}_b"
                        class="edit-bought"
                        type="checkbox"
                        ${
                            item &&
                            item.bought
                            ? "checked"
                            : ""
                        }
                    >

                    <label for="${id}_b">

                        <span class="check-box">
                            ✓
                        </span>

                        已購買

                    </label>

                </div>


                <div class="check">

                    <input
                        id="${id}_o"
                        class="edit-out"
                        type="checkbox"
                        ${
                            item &&
                            item.out
                            ? "checked"
                            : ""
                        }
                    >

                    <label for="${id}_o">

                        <span class="check-box">
                            ✓
                        </span>

                        沒貨

                    </label>

                </div>

            </div>

        </div>

    `;


    container.appendChild(div);

}


/* =====================================
   刪除編輯中的品項
===================================== */

function removeEditItem(button){

    button
        .closest(".edit-item")
        .remove();


    updateEditPayment();

}


/* =====================================
   編輯付款預覽
===================================== */

function updateEditPayment(){

    const rows =
        document.querySelectorAll(
            "#editItems .edit-item"
        );


    let total = 0;


    rows.forEach(row => {

        total +=
            Number(
                row.querySelector(
                    ".edit-price"
                ).value
            ) || 0;

    });


    const paid =
        Number(
            document.getElementById(
                "editPaid"
            ).value
        ) || 0;


    const unpaid =
        Math.max(
            total - paid,
            0
        );


    document.getElementById(
        "editPaymentPreview"
    ).innerText =

        "訂單總額 ₩" +
        total.toLocaleString() +

        "｜已付 ₩" +
        paid.toLocaleString() +

        "｜尚欠 ₩" +
        unpaid.toLocaleString() +

        "｜約 NT$" +
        toTWD(unpaid).toLocaleString();

}


/* =====================================
   儲存修改
===================================== */

function updateOrder(){

    const order =
        orders.find(
            o => o.id === editingOrderId
        );


    if(!order){
        return;
    }


    order.customer =
        document.getElementById(
            "editCustomer"
        ).value;


    const paid =
        Number(
            document.getElementById(
                "editPaid"
            ).value
        ) || 0;


    order.paid =
        paid;


    const rows =
        document.querySelectorAll(
            "#editItems .edit-item"
        );


    const items = [];


    rows.forEach(row => {

        items.push({

            id:
                row.dataset.id,

            product:
                row.querySelector(
                    ".edit-product"
                ).value,

            price:
                Number(
                    row.querySelector(
                        ".edit-price"
                    ).value
                ) || 0,

            bought:
                row.querySelector(
                    ".edit-bought"
                ).checked,

            out:
                row.querySelector(
                    ".edit-out"
                ).checked

        });

    });


    order.items =
        items;


    saveData();

    closeEdit();

    render();

}


/* =====================================
   關閉編輯
===================================== */

function closeEdit(){

    document.getElementById(
        "editModal"
    ).classList.remove("show");


    editingOrderId = null;

}


/* =====================================
   刪除訂單
===================================== */

function deleteOrder(orderId){

    if(
        !confirm(
            "確定要刪除整張訂單嗎？"
        )
    ){

        return;

    }


    orders =
        orders.filter(
            order => order.id !== orderId
        );


    saveData();

    render();

}


/* =====================================
   顯示
===================================== */

function render(){

    const list =
        document.getElementById(
            "list"
        );


    list.innerHTML = "";


    let all = 0;

    let bought = 0;

    let out = 0;

    let unpaidTotal = 0;


    orders.forEach(order => {

        const stats =
            getStats(order);


        order.items.forEach(item => {

            all++;


            if(item.bought){
                bought++;
            }


            if(item.out){
                out++;
            }

        });


        unpaidTotal +=
            stats.unpaid;

    });


    document.getElementById(
        "allCount"
    ).innerText = all;


    document.getElementById(
        "boughtCount"
    ).innerText = bought;


    document.getElementById(
        "outCount"
    ).innerText = out;


    document.getElementById(
        "unpaidTotal"
    ).innerText =
        "₩" +
        unpaidTotal.toLocaleString();


    const filtered =
        orders.filter(orderMatches);


    document.getElementById(
        "totalText"
    ).innerText =
        filtered.length +
        " 位客人";


    if(filtered.length === 0){

        list.innerHTML = `

            <div class="empty">
                目前沒有符合條件的訂單 ♡
            </div>

        `;

        return;

    }


    filtered.forEach(order => {

        const stats =
            getStats(order);


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "customer-card";


        /* =====================
           客人標題
        ===================== */

        card.innerHTML = `

            <div class="customer-head">

                <div class="customer-top">

                    <div class="customer-name">

                        👤 ${
                            escapeHTML(
                                order.customer ||
                                "未填寫姓名"
                            )
                        }

                    </div>


                    <button
                        class="edit-order-btn"
                        onclick="openEdit(
                            ${order.id}
                        )"
                    >
                        編輯訂單
                    </button>

                </div>


                <div class="order-summary">

                    <div class="summary-box">

                        <div class="summary-label">
                            訂單總額
                        </div>

                        <div class="summary-value">
                            ₩${stats.total.toLocaleString()}
                        </div>

                        <div class="summary-twd">
                            約 NT$${toTWD(
                                stats.total
                            ).toLocaleString()}
                        </div>

                    </div>


                    <div class="summary-box">

                        <div class="summary-label">
                            已購買
                        </div>

                        <div class="summary-value">
                            ₩${stats.bought.toLocaleString()}
                        </div>

                        <div class="summary-twd">
                            約 NT$${toTWD(
                                stats.bought
                            ).toLocaleString()}
                        </div>

                    </div>

                </div>


                <div class="payment-box">

                    <div class="payment-row">

                        <span>
                            已付
                        </span>

                        <span class="payment-value">
                            ₩${stats.paid.toLocaleString()}
                            ／
                            NT$${toTWD(
                                stats.paid
                            ).toLocaleString()}
                        </span>

                    </div>


                    <div class="payment-row">

                        <span>
                            尚欠
                        </span>

                        <span class="payment-value debt">

                            ₩${stats.unpaid.toLocaleString()}
                            ／
                            NT$${toTWD(
                                stats.unpaid
                            ).toLocaleString()}

                        </span>

                    </div>

                </div>

            </div>

        `;


        /* =====================
           品項
        ===================== */

        order.items.forEach(item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item";


            let badges = "";


            if(item.bought){

                badges += `

                    <span class="badge active">
                        ✓ 已購買
                    </span>

                `;

            }else{

                badges += `

                    <span class="badge">
                        ⏳ 未購買
                    </span>

                `;

            }


            if(item.out){

                badges += `

                    <span class="badge out">
                        × 沒貨
                    </span>

                `;

            }


            div.innerHTML = `

                <div class="item-main">

                    <div class="item-name">

                        ${
                            escapeHTML(
                                item.product ||
                                "未填寫品項"
                            )
                        }

                    </div>


                    <div class="item-price">

                        <div class="krw">
                            ₩${Number(
                                item.price || 0
                            ).toLocaleString()}
                        </div>

                        <div class="twd">
                            約 NT$${toTWD(
                                item.price
                            ).toLocaleString()}
                        </div>

                    </div>

                </div>


                <div class="badges">

                    ${badges}

                </div>

            `;


            card.appendChild(div);

        });


        /* =====================
           底部
        ===================== */

        const footer =
            document.createElement(
                "div"
            );


        footer.className =
            "order-footer";


        footer.innerHTML = `

            <span class="item-count">

                ${order.items.length}
                個品項

            </span>


            <button
                class="delete-order"
                onclick="deleteOrder(
                    ${order.id}
                )"
            >
                刪除整張訂單
            </button>

        `;


        card.appendChild(footer);


        list.appendChild(card);

    });

}


/* =====================================
   HTML 防護
===================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}
